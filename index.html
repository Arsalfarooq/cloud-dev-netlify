<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="inventory.html">Inventory</a>
    <a href="contact.html">Contact</a>
    <a href="upload.html">Upload</a>
  </nav>

  <div class="container">
    <section id="home">
      <h1>Welcome to AutoHub</h1>
      <p>Your one-stop place for buying and selling cars.</p>
      <p>I am passionate about automobiles and the car business.</p>
      <p>This website shows my interest in the automotive business and web development.</p>
    </section>

    <section id="visitors">
      <h2>Recent Visitors</h2>
      <ul id="visitor-list"></ul>
    </section>

  </div>

<script>
  fetch('/.netlify/functions/get-visitors')
    .then(response => response.json())
    .then(visitors => {
      const list = document.getElementById('visitor-list');

      visitors.forEach(v => {
        const item = document.createElement('li');
        item.textContent = v.name + ' - ' + v.visited_at;
        list.appendChild(item);
      });

      if (visitors.length === 0) {
        const item = document.createElement('li');
        item.textContent = 'No visitors found yet.';
        list.appendChild(item);
      }
    })
    .catch(err => console.error('Function call failed:', err));
</script>
</body>
</html>
