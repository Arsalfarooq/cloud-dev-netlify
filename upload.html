<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoHub - Upload</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .upload-box {
      background: #f9f9f9;
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      margin: 30px auto;
      max-width: 500px;
    }
    .upload-box input[type="file"] {
      margin: 15px 0;
      display: block;
      width: 100%;
    }
    .upload-box button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
    }
    .upload-box button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 20px;
      font-size: 1em;
    }
    #status a {
      color: #007bff;
      word-break: break-all;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="inventory.html">Inventory</a>
    <a href="contact.html">Contact</a>
    <a href="upload.html">Upload</a>
  </nav>

  <div class="container">
    <h1>Upload a File</h1>
    <p>Upload car photos or documents directly to our cloud storage.</p>

    <div class="upload-box">
      <label for="fileInput">Choose a file:</label>
      <input type="file" id="fileInput">
      <button onclick="uploadFile()">Upload to Azure</button>
      <div id="status"></div>
    </div>
  </div>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const file = fileInput.files[0];

      if (!file) {
        status.className = 'error';
        status.textContent = '⚠️ Please select a file first.';
        return;
      }

      status.className = '';
      status.textContent = '⏳ Uploading...';

      // Your Azure storage details
      const accountName = 'arsalcloud6343';
      const containerName = 'uploads';
      const sasToken = 'sv=2025-11-05&ss=b&srt=co&sp=rwltfx&se=2026-07-03T04:03:43Z&st=2026-04-14T19:48:43Z&spr=https&sig=Tlx5wgfj2Rg%2ByYjMm2j99jrg6EKwAaMFQgwoGEUFTwg%3D';

      const blobUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${file.name}?${sasToken}`;

      try {
        const response = await fetch(blobUrl, {
          method: 'PUT',
          headers: {
            'x-ms-blob-type': 'BlockBlob',
            'Content-Type': file.type
          },
          body: file
        });

        if (response.ok) {
          const fileUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${file.name}`;
          status.className = 'success';
          status.innerHTML = `✅ Upload successful!<br><a href="${fileUrl}" target="_blank">View your file here</a>`;
        } else {
          status.className = 'error';
          status.textContent = `❌ Upload failed. Status: ${response.status} ${response.statusText}`;
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = '❌ Error: ' + err.message;
      }
    }
  </script>

</body>
</html>
